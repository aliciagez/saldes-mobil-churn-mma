name: Docker - Build, Smoke Test and GHCR

on:
  workflow_call:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read
      packages: write
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: approved-modell-${{ github.sha }}
          path: approved-model/

      - name: Verify model files
        run: |
          test -f approved-model/modell.joblib
          test -f approved-model/matvarden.json

      - name: Build Docker image
        run: docker build -t churn-api:test .

      - name: Start Docker container
        run: docker run -d --name churn-api -p 8000:8000 churn-api:test

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      

      - name: run smoketest
        run: uv run --extra dev pytest tests/test_smoke.py -v

  
      - name: log in ghcr
        uses: docker/login-action@v4
        with: 
           registry: ghcr.io 
           username: "${{ github.actor }}"
           password: "${{ secrets.GITHUB_TOKEN }}" 

      - name: docker bulidx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container     

      - name: push to ghcr          
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_name == 'main' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: show docker fails 
        if: failure()
        run: docker logs churn-api

 