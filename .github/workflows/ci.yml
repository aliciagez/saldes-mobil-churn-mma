name: CI

on: 
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths: 
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

# Test av concurrency 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps: 
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7 
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" 
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: pytest


  train:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/


  utvardera:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7 
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" 
          cache-dependency-path: "pyproject.toml"

      
      - run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.evaluate 

      - name: Visa mätvärden i Summary
        run: |
          echo "## Modellens mätvärden" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat outputs/matvarden.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY