name: CI

on: 
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "kontroller/**"

  pull_request:
    branches: [main]
    paths: 
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "kontroller/**"


  workflow_dispatch:
    inputs: 
      datafil:
        description: "Välj vilken kundfil som ska valideras"
        required: true
        default: "data/kundbas.csv"
        type: choice
        options:
          - "data/kundbas.csv"
          - "data/kundbas_ny_leverans.csv"

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps: 
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup 
        with:
          python-version: ${{ matrix.python-version }}

      - run: pytest

  validera_data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - run: python kontroller/schema.py "${{ inputs.datafil || 'data/kundbas.csv' }}"

  train:
    needs: [test, validera_data]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"  

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/


  utvardera:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup 
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.evaluate 

      - name: Visa mätvärden i Summary
        run: |
          echo "## Modellens mätvärden" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat outputs/matvarden.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  ringlista:
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup 
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.score

      - uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          
